<!doctype html>
<html><head><meta charset="utf-8"><title>fireflare</title></head>
<body>
<h1 id="config"></h1>
<p id="detail"></p>
<pre id="log">running @cloudflare/speedtest...</pre>
<script type="module">
const params = new URLSearchParams(location.search);
const h3 = params.has('h3');
const debugMode = params.has('debug');
// `api` (e.g. https://localhost4:8443) points the run at a self-hosted stand-in
// for speed.cloudflare.com (proxy-bench), which also serves the library from
// its --docroot.
const benchApi = params.get('api');
const apiBase = benchApi ||
  (h3 ? 'https://bastion.h3.speed.cloudflare.com' : 'https://speed.cloudflare.com');

// `prime`: fetch the server once so Firefox stores its h3 Alt-Svc, then stop
// (see prime_h3_altsvc in main.py). Done here rather than by navigating to the
// server, whose responses are downloads.
if (params.has('prime')) {
  try {
    await fetch(`${apiBase}/__down?bytes=0&prime=${Date.now()}`);
    window.__fireflare_primed = true;
  } catch (e) {
    window.__fireflare_error = 'prime: ' + String((e && e.message) || e);
  }
  await new Promise(() => {});  // never resolves: stop the module here
}

const { default: SpeedTest } = await import(
  benchApi ? `${benchApi}/speedtest.js` : 'https://esm.sh/@cloudflare/speedtest');
const log = document.getElementById('log');
// Based on @cloudflare/speedtest's defaultConfig. Packet-loss entry dropped
// (needs a TURN server). Counts roughly doubled for a tighter distribution
// per bucket, ~2× total runtime.
// Source: cloudflare/speedtest src/config/defaultConfig.js
// During a --matrix run each config gets its own Firefox session, so without
// this the window gives no clue which of the five is in flight. `desc` is the
// path this run is expected to take, phrased by facts.py the same way the
// report phrases what it turned out to be; `label` is the terse name that ends
// up in the result filename.
const label = params.get('label');
const desc = params.get('desc');
document.getElementById('config').textContent = desc || label || 'fireflare';
document.title = 'fireflare: ' + (label || desc || 'run');
const detail = [];
if (desc) detail.push('expected path, confirmed from the result once it lands');
if (label) detail.push('config ' + label);
detail.push((debugMode ? 'debug subset' : 'full set') + ' of measurements');
detail.push('endpoint ' + new URL(apiBase).host);
document.getElementById('detail').textContent = detail.join(' · ');
// The measurements take a couple of minutes with no output of their own, so
// tick an elapsed counter to show the run is alive, and name the measurement
// currently in flight so a stall is attributable to a phase (an upload bucket
// crawling is the interesting case for MASQUE).
const startedAt = Date.now();
let phase = 'starting up';
const mbps = (v) => (v ? (v / 1e6).toFixed(1) + ' Mbps' : '-');
const ticker = setInterval(() => {
  const s = Math.round((Date.now() - startedAt) / 1000);
  const lines = [`${phase}, ${s}s elapsed`];
  const r = st && st.results;
  if (r) {
    lines.push(`so far: down ${mbps(r.getDownloadBandwidth())}, ` +
               `up ${mbps(r.getUploadBandwidth())}`);
  }
  log.textContent = lines.join('\n');
}, 1000);
const endpointOverrides = {
  downloadApiUrl: apiBase + '/__down',
  uploadApiUrl:   apiBase + '/__up',
  ...(benchApi ? { logAimApiUrl: apiBase + '/__results' } : {}),
};

async function fetchTrace() {
  try {
    if (benchApi) {
      // No cdn-cgi/trace here, so take the HTTP version a last zero-byte
      // request negotiated from Resource Timing ('h3', 'h2', 'http/1.1'). This
      // needs the server's Timing-Allow-Origin, as the request is cross-origin.
      const url = `${apiBase}/__down?bytes=0&trace=${Date.now()}`;
      await (await fetch(url)).arrayBuffer();
      return { http: performance.getEntriesByName(url).pop()?.nextHopProtocol };
    }
    // cdn-cgi/trace returns plain text, one `key=value` per line. Gives us
    // client IP (as seen by Cloudflare), colo (edge PoP), country, HTTP
    // version, TLS version, SNI, context a MASQUE comparison needs.
    const r = await fetch(apiBase + '/cdn-cgi/trace');
    const txt = await r.text();
    return Object.fromEntries(
      txt.trim().split('\n').filter(l => l.includes('=')).map(l => {
        const i = l.indexOf('=');
        return [l.slice(0, i), l.slice(i + 1)];
      })
    );
  } catch (e) {
    return { error: String((e && e.message) || e) };
  }
}
// Debug mode runs a tiny subset so end-to-end iteration is fast (used to
// validate plumbing changes, the numbers are not meaningful).
const measurements = debugMode ? [
  { type: 'latency', numPackets: 1 },
  { type: 'download', bytes: 1e5, count: 1, bypassMinDuration: true },
  { type: 'upload',   bytes: 1e5, count: 1, bypassMinDuration: true },
] : [
  { type: 'latency', numPackets: 1 },
  { type: 'download', bytes: 1e5, count: 1, bypassMinDuration: true },
  { type: 'latency', numPackets: 50 },
  { type: 'download', bytes: 1e5, count: 15 },
  { type: 'download', bytes: 1e6, count: 15 },
  { type: 'upload', bytes: 1e5, count: 15 },
  { type: 'upload', bytes: 1e6, count: 12 },
  { type: 'download', bytes: 1e7, count: 12 },
  { type: 'upload', bytes: 1e7, count: 8 },
  { type: 'download', bytes: 2.5e7, count: 8 },
  { type: 'upload', bytes: 2.5e7, count: 8 },
  { type: 'download', bytes: 1e8, count: 6 },
  { type: 'upload', bytes: 5e7, count: 6 },
  { type: 'download', bytes: 2.5e8, count: 4 },
];
const st = new SpeedTest({
  ...endpointOverrides,
  loadedLatencyMaxPoints: 50,
  measurements,
});
// Fires as each measurement produces points, so it doubles as a phase readout.
st.onResultsChange = (ev) => {
  const type = ev && ev.type;
  if (type) phase = `measuring ${type}`;
};
st.onFinish = async (results) => {
  clearInterval(ticker);
  const trace = await fetchTrace();
  const out = {
    trace,
    userAgent: navigator.userAgent,
    h3Endpoint: h3,
    summary: results.getSummary(),
    // The public point getters keep only `ping` (= ttfb - serverTime, floored
    // at 0), which throws away the inputs and cannot represent a failed
    // sample. `raw` carries the full per-sample timing objects, ttfb and
    // serverTime included, for the idle pings and for the loaded pings that
    // ride alongside each transfer. The report derives latency from ttfb.
    raw: results.raw,
    downloadBandwidth: results.getDownloadBandwidth(),
    uploadBandwidth: results.getUploadBandwidth(),
    downloadBandwidthPoints: results.getDownloadBandwidthPoints(),
    uploadBandwidthPoints: results.getUploadBandwidthPoints(),
    unloadedLatencyPoints: results.getUnloadedLatencyPoints(),
    downLoadedLatencyPoints: results.getDownLoadedLatencyPoints(),
    upLoadedLatencyPoints: results.getUpLoadedLatencyPoints(),
  };
  window.__fireflare_result = out;
  log.textContent = JSON.stringify(out, null, 2);
};
st.onError = (err) => {
  clearInterval(ticker);
  window.__fireflare_error = String((err && err.message) || err);
  log.textContent = 'error: ' + window.__fireflare_error;
};
</script>
</body></html>
